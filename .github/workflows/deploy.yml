name: Deploy Next.js site to Pages
on:
  push:
    branches: ["master"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './sergin-portfolio/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: ./sergin-portfolio
      - name: Build with Next.js
        run: npm run build
        working-directory: ./sergin-portfolio
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sergin-portfolio/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4